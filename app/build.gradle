plugins {
    id 'com.android.application'
}

def releaseStorePath = System.getenv('THRAMART_KEYSTORE_PATH')
def releaseStorePassword = System.getenv('THRAMART_STORE_PASSWORD')
def releaseKeyAlias = System.getenv('THRAMART_KEY_ALIAS')
def releaseKeyPassword = System.getenv('THRAMART_KEY_PASSWORD')
def hasReleaseSigning = releaseStorePath && releaseStorePassword && releaseKeyAlias && releaseKeyPassword

android {
    namespace 'com.company.kiosk'
    compileSdk 36

    defaultConfig {
        applicationId 'com.company.kiosk'
        minSdk 26
        targetSdk 36
        versionCode 4
        versionName '1.3.0-thramart-dual-wa'
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseStorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
