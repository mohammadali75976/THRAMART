name: 3 - Owner Release Signed Build

on:
  workflow_dispatch:

jobs:
  signed-owner-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Validate signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.THRAMART_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.THRAMART_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.THRAMART_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.THRAMART_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.THRAMART_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/thramart-release.jks"

      - name: Build signed owner-release APK
        env:
          THRAMART_KEYSTORE_PATH: ${{ runner.temp }}/thramart-release.jks
          THRAMART_STORE_PASSWORD: ${{ secrets.THRAMART_STORE_PASSWORD }}
          THRAMART_KEY_ALIAS: ${{ secrets.THRAMART_KEY_ALIAS }}
          THRAMART_KEY_PASSWORD: ${{ secrets.THRAMART_KEY_PASSWORD }}
        run: gradle :app:assembleRelease

      - name: Upload signed owner-release APK
        uses: actions/upload-artifact@v4
        with:
          name: Thramart-Kiosk-v6-owner-release-signed
          path: app/build/outputs/apk/release/app-release.apk
